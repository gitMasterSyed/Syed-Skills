<!DOCTYPE html>

<script>
        // High-priority fix for "Cannot set property fetch of #<Window> which has only a getter"
        (function() {
            try {
                const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
                if (desc && !desc.set && desc.configurable) {
                    const originalFetch = window.fetch;
                    Object.defineProperty(window, 'fetch', {
                        get: function() { return originalFetch; },
                        set: function(v) { console.warn("Blocked fetch overwrite"); },
                        configurable: true,
                        enumerable: true
                    });
                }
            } catch (e) {
                console.error("Fetch protection failed:", e);
            }
        })();
    </script>

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Log start to help debugging
        console.log("Syed Sajid Portfolio: Script initializing...");

        const { useState, useEffect } = React;
        
        // Fallback for Motion if the CDN fails or global name is different
        // In UMD, Framer Motion often exports to window.Motion
        const motion = (window.Motion && window.Motion.motion) ? window.Motion.motion : {
            div: (props) => <div {...props} />,
            h1: (props) => <h1 {...props} />,
            h2: (props) => <h2 {...props} />,
            section: (props) => <section {...props} />,
            span: (props) => <span {...props} />,
            header: (props) => <header {...props} />,
            li: (props) => <li {...props} />
        };

        // Simple Icon Component using Lucide
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const Header = () => {
            const qrRef = React.useRef(null);

            useEffect(() => {
                const generateQR = () => {
                    if (qrRef.current && window.QRCode) {
                        qrRef.current.innerHTML = "";
                        // Standardized vCard 3.0 format with CRLF line endings for maximum compatibility
                        const vCardLines = [
                            "BEGIN:VCARD",
                            "VERSION:3.0",
                            "FN:Syed Sajid",
                            "N:Sajid;Syed;;;",
                            "TITLE:Enterprise Apps Specialist",
                            "TEL;TYPE=CELL:+971508355902",
                            "TEL;TYPE=WORK:+918050374251",
                            "EMAIL:mailsyedsajid@gmail.com",
                            "URL:https://linkedin.com/in/syed-s-53a665aa",
                            "END:VCARD"
                        ];
                        const vCardData = vCardLines.join("\r\n");

                        new QRCode(qrRef.current, {
                            text: vCardData,
                            width: 200,
                            height: 200,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.L
                        });
                    }
                };
                const timer = setTimeout(generateQR, 500);
                return () => clearTimeout(timer);
            }, []);

            return (
                <header className="relative mb-16 md:mb-24">
                    <div className="flex flex-col lg:flex-row items-center gap-8 lg:gap-12">
                        

                        <div className="flex-1 text-center lg:text-left">
                            <h1 className="text-4xl md:text-5xl lg:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-sky-400 tracking-tight">
                                Syed Sajid
                            </h1>
                            <h2 className="mt-4 text-xl md:text-2xl font-medium text-cyan-300/90 leading-tight">
                                Enterprise Applications & Integration Specialist
                            </h2>
                            <p className="mt-6 max-w-2xl text-lg text-slate-400 leading-relaxed">
                                13+ years of experience driving enterprise integration, application governance, and digital transformation. Expert in architecting and managing Atlassian ecosystems and automating business processes.
                            </p>
                        </div>
                    </div>
                    
                    <div className="mt-12 flex flex-col md:flex-row items-center gap-10 border-t border-slate-800/50 pt-10">
                        <div className="flex-1 flex flex-wrap items-center gap-x-10 gap-y-6">
                            <a href="mailto:mailsyedsajid@gmail.com" className="flex items-center gap-3 text-slate-300 hover:text-cyan-300 transition-all duration-300 group">

                                    <Icon name="mail" className="w-5 h-5 text-cyan-400" />
                                </div>
                                <span className="font-medium text-sm md:text-base">mailsyedsajid@gmail.com</span>
                            </a>
                            <a href="https://linkedin.com/in/syed-s-53a665aa" target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 text-slate-300 hover:text-cyan-300 transition-all duration-300 group">
                                <div className="p-2.5 rounded-full bg-slate-800 group-hover:bg-cyan-900/40 transition-colors">
                                    <Icon name="linkedin" className="w-5 h-5 text-cyan-400" />
                                </div>

                            </a>

                                </div>
                                <div className="flex flex-col">
                                    <span className="font-medium text-sm leading-tight">+971508355902</span>
                                    <span className="font-medium text-xs leading-tight text-slate-500 mt-1">+918050374251</span>
                                </div>
                            </div>
                        </div>

                        {/* Large, Clear QR Code */}
                        <div className="flex-shrink-0">
                            <div className="group relative">

                                    <div ref={qrRef} className="rounded-lg overflow-hidden" style={{ width: '200px', height: '200px' }}></div>
                                </div>

                                    </div>

            );
        };

        const Experience = () => {
            const experienceData = [
                {
                    role: "Consultant Cloud Operations Specialist",
                    company: "Sundus Recruitment and Outsourcing Services",
                    duration: "Mar 2024 - Present",
                    achievements: [
                        "Led Atlassian instance migrations across cloud and on-premises environments.",
                        "Implemented integrations with DocuSign, GitHub, Microsoft Teams, Slack, and ChatGPT.",
                        "Enforced identity governance and SSO via Microsoft Entra ID.",
                        "Managed 33+ AWS Route 53 hosted zones, ensuring high availability.",
                        "Designed and governed organization-wide email signature frameworks."
                    ]
                },
                {
                    role: "Atlassian Expert",
                    company: "PractiProject | Atlassian Platinum Solution Partner",
                    duration: "Feb 2022 - Feb 2024",
                    achievements: [
                        "Spearheaded JIRA (8.4 to 9.12.x) and Confluence (7.13.x to 8.5.x) migrations.",
                        "Re-architected and optimized legacy Atlassian solutions, improving reliability and speed.",
                        "Designed and implemented advanced Groovy scripts to automate complex workflows.",
                        "Championed the adoption of new features and technologies within the Atlassian suite."
                    ]
                },
                {
                    role: "Senior Software Consultant",
                    company: "Etisalat UAE",
                    duration: "May 2014 - Jan 2022",
                    achievements: [
                        "Integrated assignment-level and annual appraisal lifecycle processes.",
                        "Spearheaded the implementation of a risk management system.",

                    ]

                {

                    company: "CenturyLink & L&T IES",
                    duration: "Jan 2011 - Apr 2014",
                    achievements: [
                        "Analyzed requirements and provided technical solutions.",
                        "Developed custom widgets using jQuery UI, HighCharts, and Kendo framework.",

                }
            ];

            return (
                <section id="experience" className="scroll-mt-20">
                    <h2 className="text-3xl font-bold text-slate-100 mb-10 flex items-center gap-4">
                        <span className="h-px flex-1 bg-slate-800"></span>
                        Work Experience
                        <span className="h-px flex-1 bg-slate-800"></span>
                    </h2>
                    <div className="relative border-l-2 border-slate-800 ml-4 sm:ml-6">
                        {experienceData.map((item, idx) => (
                            <div key={idx} className="relative pl-8 sm:pl-12 py-8 group">
                                <div className="z-10 bg-slate-800 h-10 w-10 absolute left-[-21px] sm:left-[-21px] top-6 rounded-full flex items-center justify-center ring-4 ring-slate-900 group-hover:ring-cyan-500/30 transition-all duration-300">
                                    <Icon name="briefcase" className="h-5 w-5 text-cyan-400" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-100">{item.role}</h3>
                                <div className="flex flex-col sm:flex-row items-start sm:items-center sm:gap-4 mb-4">
                                    <p className="text-cyan-400/90 font-semibold">{item.company}</p>
                                    <span className="text-slate-600 hidden sm:block">•</span>
                                    <p className="text-slate-500 font-medium text-sm">{item.duration}</p>
                                </div>
                                <ul className="space-y-3 mt-4">
                                    {item.achievements.map((achievement, i) => (
                                        <li key={i} className="flex items-start gap-3 group/item text-slate-400 hover:text-slate-300 transition-colors leading-relaxed">
                                            <Icon name="chevron-right" className="w-5 h-5 mt-0.5 text-cyan-500/50" />

                                        </li>
                                    ))}
                                </ul>
                            </div>
                        ))}
                    </div>
                </section>
            );

        const Education = () => (
            <section id="education" className="scroll-mt-20">
                <h2 className="text-3xl font-bold text-slate-100 mb-8">Education</h2>
                <div className="bg-slate-800/30 border border-slate-700/50 p-8 rounded-2xl flex flex-col md:flex-row items-center md:items-start gap-6 hover:bg-slate-800/50 transition-colors group">
                    <div className="flex-shrink-0 p-4 rounded-xl bg-slate-900 group-hover:bg-cyan-900/20 transition-colors">
                        <Icon name="graduation-cap" className="w-10 h-10 text-cyan-400" />
                    </div>
                    <div className="text-center md:text-left">
                        <h3 className="font-bold text-slate-100 text-2xl group-hover:text-cyan-100 transition-colors">B.Tech, Computer Science and Engineering</h3>
                        <p className="text-slate-400 font-medium text-lg mt-1">JNT University</p>

        const Footer = () => (
            <footer className="bg-slate-900 border-t border-slate-800/50 mt-32">
                <div className="container mx-auto max-w-5xl px-6 py-12 text-center">
                    <h2 className="text-xl font-bold text-slate-100 mb-6 tracking-tight italic opacity-50">Syed Sajid</h2>
                    <div className="flex justify-center items-center gap-8 mb-8">
                        <a href="mailto:mailsyedsajid@gmail.com" className="text-slate-400 hover:text-cyan-400 transition-colors duration-300">
                            <Icon name="mail" className="w-6 h-6" />
                        </a>
                        <a href="https://linkedin.com/in/syed-s-53a665aa" target="_blank" rel="noopener noreferrer" className="text-slate-400 hover:text-cyan-400 transition-colors duration-300">
                            <Icon name="linkedin" className="w-6 h-6" />

                    </div>
                    <p className="text-sm text-slate-500 font-medium tracking-wide">

        const App = () => {

        try {

            root.render(<App />);

            const rootElement = document.getElementById('root');
            if (rootElement) {
                rootElement.innerHTML = `
                    <div style="background:#1e293b; color:#ef4444; padding:2rem; border-radius:1rem; margin:2rem; border:1px solid #334155; font-family:sans-serif;">
                        <h1 style="font-size:1.5rem; margin-bottom:1rem;">Application Error</h1>
                        <p style="color:#94a3b8; margin-bottom:1.5rem;">There was a problem loading the portfolio. This usually happens when a remote library (CDN) fails to load.</p>
                        <pre style="background:#0f172a; padding:1rem; border-radius:0.5rem; overflow:auto; font-size:0.875rem;">${error.message}</pre>
                        <button onclick="window.location.reload()" style="margin-top:1.5rem; background:#0891b2; color:white; border:none; padding:0.5rem 1rem; border-radius:0.25rem; cursor:pointer;">Retry Loading</button>

</body>
