<!DOCTYPE html>

<head>

    <!-- Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Motion via CDN is sometimes tricky, let's use a standard animation approach if Motion is unavailable, or use framer-motion UMD if possible -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #cbd5e1;
            font-family: 'Inter', sans-serif;
        }
        .text-neon {
            color: #22d3ee;

        }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion } = window.Motion || { motion: { div: 'div', h1: 'h1', h2: 'h2', section: 'section' } };

        // Simple Icon Component using Lucide
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className}></i>;

                        Enterprise Applications & Integration Specialist

                    </p>
                </div>
                
                <div className="mt-10 flex justify-center items-center gap-6 md:gap-8 flex-wrap">
                    <a href="mailto:mailsyedsajid@gmail.com" className="flex items-center gap-2.5 text-slate-300 hover:text-cyan-300 transition-all duration-300 group">
                        <div className="p-2 rounded-full bg-slate-800 group-hover:bg-cyan-900/30 transition-colors">
                            <Icon name="mail" />
                        </div>
                        <span className="font-medium">mailsyedsajid@gmail.com</span>
                    </a>
                    <a href="https://linkedin.com/in/syed-s-53a665aa" target="_blank" rel="noopener noreferrer" className="flex items-center gap-2.5 text-slate-300 hover:text-cyan-300 transition-all duration-300 group">
                        <div className="p-2 rounded-full bg-slate-800 group-hover:bg-cyan-900/30 transition-colors">
                            <Icon name="linkedin" />
                        </div>
                        <span className="font-medium">LinkedIn</span>
                    </a>
                    <div className="flex items-center gap-2.5 text-slate-300 group">
                        <div className="p-2 rounded-full bg-slate-800">
                            <Icon name="phone" className="w-5 h-5 text-cyan-400" />
                        </div>
                        <span className="font-medium">+971508355902</span>
                    </div>
                    <div className="flex items-center gap-2.5 text-slate-300 group">
                        <div className="p-2 rounded-full bg-slate-800">

                { category: "Security & Identity", icon: "shield", skills: ["Microsoft Entra ID", "SSO", "GlobalSign Certificates", "Compliance Frameworks"] },
                { category: "Legacy Expertise", icon: "layers", skills: ["jQuery", "Kendo UI", "Spring Framework", "CSS", "JavaScript"] }
            ];

            return (
                <section id="skills" className="scroll-mt-20">
                    <h2 className="text-3xl font-bold text-slate-100 mb-10">Technical Expertises</h2>

                                    ))}

                                    <div className="flex items-center gap-2 text-slate-500 text-xs font-medium uppercase tracking-wider mt-3">
                                        <span>{item.date}</span>
                                        {item.expires && (
                                            <>
                                                <span className="w-1 h-1 rounded-full bg-slate-700"></span>

                                </div>
                            </div>
                        ))}

            );
        };

        const Experience = () => {
            const experienceData = [
                {
                    role: "Consultant Cloud Operations Specialist",

                    duration: "Mar 2024 - Present",

                    ]

                    company: "CenturyLink & L&T IES",
                    duration: "Jan 2011 - Apr 2014",
                    achievements: [
                        "Analyzed requirements and provided technical solutions.",

            ];

            return (
                <section id="experience" className="scroll-mt-20">
                    <h2 className="text-3xl font-bold text-slate-100 mb-10 flex items-center gap-4">
                        <span className="h-px flex-1 bg-slate-800"></span>
                        Work Experience
                        <span className="h-px flex-1 bg-slate-800"></span>
                    </h2>
                    <div className="relative border-l-2 border-slate-800 ml-4 sm:ml-6">
                        {experienceData.map((item, idx) => (
                            <div key={idx} className="relative pl-8 sm:pl-12 py-8 group">
                                <div className="z-10 bg-slate-800 h-10 w-10 absolute left-[-21px] sm:left-[-21px] top-6 rounded-full flex items-center justify-center ring-4 ring-slate-900 group-hover:ring-cyan-500/30 transition-all duration-300">
                                    <Icon name="briefcase" className="h-5 w-5 text-cyan-400" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-100">{item.role}</h3>
                                <div className="flex flex-col sm:flex-row items-start sm:items-center sm:gap-4 mb-4">
                                    <p className="text-cyan-400/90 font-semibold">{item.company}</p>
                                    <span className="text-slate-600 hidden sm:block">•</span>
                                    <p className="text-slate-500 font-medium text-sm">{item.duration}</p>
                                </div>
                                <ul className="space-y-3 mt-4">
                                    {item.achievements.map((achievement, i) => (
                                        <li key={i} className="flex items-start gap-3 group/item text-slate-400 hover:text-slate-300 transition-colors leading-relaxed">

                    <h2 className="text-xl font-bold text-slate-100 mb-6 tracking-tight italic opacity-50">Syed Sajid</h2>
                    <div className="flex justify-center items-center gap-8 mb-8">

                            <Icon name="mail" className="w-6 h-6" />
                        </a>
                        <a href="https://linkedin.com/in/syed-s-53a665aa" target="_blank" rel="noopener noreferrer" className="text-slate-400 hover:text-cyan-400 transition-colors duration-300">
                            <Icon name="linkedin" className="w-6 h-6" />

                    </div>
                    <p className="text-sm text-slate-500 font-medium tracking-wide">
                        &copy; {new Date().getFullYear()} SYED SAJID. ALL RIGHTS RESERVED.

        );

        const App = () => {
            return (
                <div className="min-h-screen bg-slate-900">
                    <main className="container mx-auto max-w-5xl px-6 py-12 md:py-20">
                        <Header />
                        <div className="space-y-16 md:space-y-24 mt-16 md:mt-24">
                            <Skills />
                            <Certifications />
                            <Experience />
                            <Education />
                        </div>
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
